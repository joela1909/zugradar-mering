<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f3f1ed" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)"/>
<meta name="color-scheme" content="light dark"/>
<title>Zugradar Mering St Afra</title>
</head>
<body>
<div id="map"></div>
<div id="dirctl" class="glass dirctl" role="group" aria-label="Richtung"><button data-d="muenchen">→ München</button><button data-d="augsburg">→ Augsburg</button></div>
<div id="status" class="glass status"><span id="mode">…</span><span id="err"></span></div>
<div class="fabs glass"><button id="d3" title="3D-Ansicht">3D</button><button id="gps" title="Live-Standort"><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 11.5 20 4l-7.5 16-2-6.5z" stroke-linejoin="round"/></svg></button><button id="refresh" title="Aktualisieren"><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.7-6" stroke-linecap="round"/><path d="M20 4v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="fit" title="Ganze Strecke"><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
<div id="toast" class="glass toast" role="status" hidden></div>
<section id="board" class="glass board" hidden></section>
<section id="tag" class="glass tag"></section>
<script type="module" src="/src/main.js"></script>
</body>
</html>
